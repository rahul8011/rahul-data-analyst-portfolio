<!doctype html>
<!--
  index.html - poore site ka ek hi HTML page.
  Yahan sirf: title, SEO description, favicon, Google Fonts aur <div id="root"> hai.
  Baaki saara page React (src/main.jsx se) is div ke andar banata hai.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rahul Kumar | Data & Analytics Analyst</title>
    <meta
      name="description"
      content="Rahul Kumar, Data & Analytics Analyst in Bengaluru. Power BI, SQL, Python and advanced Excel dashboards, built end to end."
    />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a12'/%3E%3Crect x='12' y='34' width='10' height='18' rx='2' fill='%2322d3ee'/%3E%3Crect x='27' y='22' width='10' height='30' rx='2' fill='%238b5cf6'/%3E%3Crect x='42' y='12' width='10' height='40' rx='2' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Theme (dark/light) page dikhne se PEHLE set hoti hai, taaki screen par flash na aaye -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <!-- React yahan poora site laga deta hai -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
